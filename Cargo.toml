[package]
name = "vibe-terminal"
version = "0.1.0"
edition = "2024"
description = "A lightweight workspace terminal for AI coding"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit", "dep:async-channel", "dep:smol", "dep:image", "dep:wry", "dep:raw-window-handle", "web"]
web = ["dep:axum", "dep:tokio"]

[[bin]]
name = "vibe-terminal"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
anyhow = "1"
fs2 = "0.4"
directories = "6"
portable-pty = "=0.9.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "=0.16.2"
unicode-width = "0.2"
url = "2"
axum = { version = "=0.8.9", optional = true, features = ["ws"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
gpui-kit = { version = "=0.9.1", optional = true, features = ["syntect"] }
async-channel = { version = "2", optional = true }
smol = { version = "2", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[patch.crates-io]
vt100 = { path = "vendor/vt100" }

[dev-dependencies]
tokio-tungstenite = "=0.29.0"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = { version = "0.6", optional = true }
wry = { version = "=0.57.1", optional = true, default-features = false, features = ["os-webview", "devtools"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "=0.3.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
